# Stage 1 QLoRA settings for mlx-lm (the base model is 4-bit, so LoRA trains as QLoRA).
# Small on purpose: an 8 GB M1 shared with other jobs. --iters and --seed come from
# stage1/train_chunk.py (one bounded chunk per heavy-gate job).
fine_tune_type: lora
num_layers: 16
batch_size: 1
learning_rate: 1.0e-4
max_seq_length: 512  # longest Stage 1 row is 173 tokens (Granite tokenizer)
grad_checkpoint: true
mask_prompt: true
steps_per_report: 10
steps_per_eval: 50
val_batches: 20
save_every: 50
lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.0
